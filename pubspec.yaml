name: ceramic_capture
description: Stage 1 ceramic photogrammetry capture app with YOLO detection and coverage tracking.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.11.0+2

  # YOLO / ML — dual mode: TFLite (prod) or HTTP (dev)
  tflite_flutter: ^0.10.4
  image: ^4.2.0

  # HTTP for dev-mode FastAPI backend
  http: ^1.2.1
  dio: ^5.4.3

  # Storage & file system
  path_provider: ^2.1.3
  path: ^1.9.0
  permission_handler: ^11.3.1

  # UUID & date
  uuid: ^4.4.0
  intl: ^0.19.0

  # PDF generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # JSON serialization
  json_annotation: ^4.9.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # UI extras
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  share_plus: ^9.0.0
  wakelock_plus: ^1.2.8
  sensors_plus: ^5.0.1        # IMU for orbit angle tracking
  device_info_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/
    - assets/sounds/
